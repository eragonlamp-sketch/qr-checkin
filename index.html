<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
    }

    body {
      background: #111 url('waiting.png') center center / cover no-repeat fixed;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* SCANNER PANEL */

    .scanner-panel {
      width: 220px;
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15, 15, 15, 0.94);
      border: 1px solid rgba(255,255,255,0.25);
    }

    #reader {
      width: 220px;
      height: 190px;
      background: #000;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* ΔΙΚΑ ΜΑΣ CONTROLS */

    .scanner-controls {
      padding: 7px;
      background: rgba(15,15,15,0.96);
    }

    #cameraSelect {
      width: 100%;
      height: 28px;
      margin-bottom: 6px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 12px;
      padding: 0 5px;
    }

    #scanButton {
      width: 100%;
      height: 30px;
      border: 1px solid #d71920;
      border-radius: 6px;
      background: #151515;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    #scanButton:active {
      background: #d71920;
    }

    /* RESULT */

    #result {
      position: absolute;
      width: 400px;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%);

      min-height: 48px;
      padding: 10px;

      border-radius: 16px;

      font-size: 17px;
      font-weight: bold;

      background: #222;
    }

    .ready {
      color: white;
    }

    .active {
      background: #d9f2df !important;
      color: #137333;
    }

    .warning {
      background: #fff3cd !important;
      color: #8a6100;
    }

    .expired {
      background: #f8d7da !important;
      color: #b3261e;
    }

    .neutral {
      background: #e5e5e5 !important;
      color: #444;
    }

    .error {
      background: #f8d7da !important;
      color: #b3261e;
    }

    .small {
      margin-top: 8px;
      font-size: 14px;
      font-weight: normal;
    }


    /* PORTRAIT */

    @media (orientation: portrait) {

      body {
        overflow: auto;
      }

      .scanner-panel {
        top: 20px;
      }

      #result {
        width: calc(100% - 40px);
        bottom: 150px;
      }
    }

  </style>
</head>


<body>

<div class="container">

  <div class="scanner-panel">

    <div id="reader"></div>

    <div class="scanner-controls">

      <select id="cameraSelect">
        <option>Φόρτωση καμερών...</option>
      </select>

      <button id="scanButton">
        Stop Scanning
      </button>

    </div>

  </div>


  <div id="result" class="ready">
    Έτοιμο για σκανάρισμα
  </div>

</div>


<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzYyKLJny_LTBuM6W048O1KdF064-XxBfKzsmgSj3akPj8exZIMWOMYs-rzk2_siq3t/exec";


let busy = false;
let lastCode = "";
let lastScanTime = 0;

let scanning = false;

let cameras = [];

let currentCameraId = null;

const html5QrCode =
  new Html5Qrcode("reader");



async function onScanSuccess(decodedText) {

  const id = decodedText.trim();

  const now = Date.now();


  if (!id) {
    return;
  }


  if (
    id === lastCode &&
    now - lastScanTime < 5000
  ) {
    return;
  }


  if (busy) {
    return;
  }


  busy = true;

  lastCode = id;

  lastScanTime = now;


  const result =
    document.getElementById("result");


  result.className = "ready";

  result.innerHTML =
    "⏳ Καταγραφή παρουσίας...";


  try {

    const response =
      await fetch(

        WEB_APP_URL,

        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            id: id
          }),

          redirect: "follow"
        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (!data.ok) {

      result.className = "error";


      if (
        data.error === "UNKNOWN_ID"
      ) {

        result.innerHTML =
          "❌ Άγνωστο QR<br><br>" +
          "ID: " + id;

      }

      else {

        result.innerHTML =
          "❌ Σφάλμα συστήματος";

      }

    }


    else {

      let cssClass =
        "neutral";


      const status =
        String(data.status || "")
          .trim()
          .toUpperCase();


      if (
        status === "ΕΝΕΡΓΟΣ"
      ) {

        cssClass =
          "active";

      }


      else if (
        status ===
        "ΛΗΓΕΙ ΣΥΝΤΟΜΑ"
      ) {

        cssClass =
          "warning";

      }


      else if (
        status === "ΕΛΗΞΕ"
      ) {

        cssClass =
          "expired";

      }


      result.className =
        cssClass;


      let duplicateText = "";


      if (data.duplicate) {

        duplicateText =
          "<div class='small'>" +
          "ℹ️ Η παρουσία είχε ήδη καταγραφεί σήμερα." +
          "</div>";

      }


      let expiryText = "";


      if (data.expiry) {

        expiryText =
          "<div class='small'>" +
          "Λήξη συνδρομής: " +
          data.expiry +
          "</div>";

      }


      result.innerHTML =
        "✅ " +
        data.message +
        "<br><br>" +

        data.name +
        "<br><br>" +

        data.status +

        expiryText +

        duplicateText;

    }

  }


  catch (error) {

    console.error(error);


    result.className =
      "error";


    result.innerHTML =
      "❌ Σφάλμα σύνδεσης με το σύστημα";

  }


  setTimeout(function() {

    result.className =
      "ready";


    result.innerHTML =
      "Έτοιμο για σκανάρισμα";


    busy = false;

  }, 3000);

}



function onScanFailure(error) {

  /* Η κάμερα συνεχίζει */

}



async function startScanner(cameraId) {

  try {

    if (scanning) {

      await html5QrCode.stop();

      scanning = false;

    }


    currentCameraId =
      cameraId;


    await html5QrCode.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 150,
          height: 150
        },

        aspectRatio: 1

      },

      onScanSuccess,

      onScanFailure

    );


    scanning = true;


    document
      .getElementById("scanButton")
      .textContent =
      "Stop Scanning";

  }


  catch (error) {

    console.error(error);

    document
      .getElementById("result")
      .innerHTML =
      "❌ Δεν ήταν δυνατή η εκκίνηση της κάμερας";

  }

}



async function stopScanner() {

  if (!scanning) {
    return;
  }


  try {

    await html5QrCode.stop();

    scanning = false;


    document
      .getElementById("scanButton")
      .textContent =
      "Start Scanning";

  }


  catch (error) {

    console.error(error);

  }

}



async function loadCameras() {

  try {

    cameras =
      await Html5Qrcode.getCameras();


    const select =
      document.getElementById(
        "cameraSelect"
      );


    select.innerHTML = "";


    cameras.forEach(function(camera) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        camera.id;


      option.textContent =
        camera.label ||
        "Camera";


      select.appendChild(
        option
      );

    });


    if (
      cameras.length === 0
    ) {

      document
        .getElementById("result")
        .innerHTML =
        "❌ Δεν βρέθηκε κάμερα";

      return;

    }


    /*
      Προσπαθούμε να επιλέξουμε
      την μπροστινή κάμερα.
    */

    let preferred =
      cameras.find(function(camera) {

        const name =
          String(camera.label)
            .toLowerCase();

        return (
          name.includes("front") ||
          name.includes("user")
        );

      });


    if (!preferred) {

      preferred =
        cameras[0];

    }


    currentCameraId =
      preferred.id;


    select.value =
      preferred.id;


    await startScanner(
      preferred.id
    );

  }


  catch (error) {

    console.error(error);


    document
      .getElementById("result")
      .innerHTML =
      "❌ Δεν ήταν δυνατή η πρόσβαση στην κάμερα";

  }

}



document
  .getElementById("cameraSelect")
  .addEventListener(
    "change",
    async function() {

      await startScanner(
        this.value
      );

    }
  );



document
  .getElementById("scanButton")
  .addEventListener(
    "click",
    async function() {

      if (scanning) {

        await stopScanner();

      }

      else {

        await startScanner(
          currentCameraId
        );

      }

    }
  );



window.addEventListener(
  "load",
  function() {

    loadCameras();

  }
);

</script>


<script>

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator
        .serviceWorker
        .register("./sw.js")

        .then(function() {

          console.log(
            "Service Worker registered"
          );

        })

        .catch(function(error) {

          console.log(
            "Service Worker registration failed:",
            error
          );

        });

    }
  );

}

</script>

</body>

</html>
