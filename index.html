<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111 url('waiting.png') center center / cover no-repeat fixed;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 15px;
    }

    h1 {
      display: none;
    }

    .subtitle {
      display: none;
    }

    /* ΚΑΜΕΡΑ */
    #reader {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Κρύβει camera selector + Stop Scanning */
    #reader__dashboard {
      display: none !important;
    }

    /* ΑΠΟΤΕΛΕΣΜΑ */
    #result {
      margin-top: 25px;
      min-height: 60px;
      padding: 10px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      background: #222;
    }

    .ready {
      color: white;
    }

    .active {
      background: #d9f2df !important;
      color: #137333;
    }

    .warning {
      background: #fff3cd !important;
      color: #8a6100;
    }

    .expired {
      background: #f8d7da !important;
      color: #b3261e;
    }

    .neutral {
      background: #e5e5e5 !important;
      color: #444;
    }

    .error {
      background: #f8d7da !important;
      color: #b3261e;
    }

    .small {
      margin-top: 12px;
      font-size: 17px;
      font-weight: normal;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📷 QR CHECK-IN</h1>

    <div class="subtitle">
      Δείξε το προσωπικό σου QR στην κάμερα
    </div>

    <div id="reader"></div>

    <div id="result" class="ready">
      Έτοιμο για σκανάρισμα
    </div>

  </div>


<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzYyKLJny_LTBuM6W048O1KdF064-XxBfKzsmgSj3akPj8exZIMWOMYs-rzk2_siq3t/exec";

let busy = false;
let lastCode = "";
let lastScanTime = 0;


async function onScanSuccess(decodedText) {

  const id = decodedText.trim();
  const now = Date.now();

  if (!id) {
    return;
  }

  // Αποφυγή συνεχόμενου διπλού scan
  if (
    id === lastCode &&
    now - lastScanTime < 5000
  ) {
    return;
  }

  if (busy) {
    return;
  }

  busy = true;
  lastCode = id;
  lastScanTime = now;

  const result =
    document.getElementById("result");

  result.className = "ready";
  result.innerHTML = "⏳ Καταγραφή παρουσίας...";


  try {

    const response = await fetch(
      WEB_APP_URL,
      {
        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          id: id
        }),

        redirect: "follow"
      }
    );


    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    const data = await response.json();


    if (!data.ok) {

      result.className = "error";

      if (data.error === "UNKNOWN_ID") {

        result.innerHTML =
          "❌ Άγνωστο QR<br><br>" +
          "ID: " + id;

      } else {

        result.innerHTML =
          "❌ Σφάλμα συστήματος";

      }

    }

    else {

      let cssClass = "neutral";

      const status =
        String(data.status || "")
          .trim()
          .toUpperCase();


      if (status === "ΕΝΕΡΓΟΣ") {

        cssClass = "active";

      }

      else if (
        status === "ΛΗΓΕΙ ΣΥΝΤΟΜΑ"
      ) {

        cssClass = "warning";

      }

      else if (status === "ΕΛΗΞΕ") {

        cssClass = "expired";

      }


      result.className = cssClass;


      let duplicateText = "";

      if (data.duplicate) {

        duplicateText =
          "<div class='small'>" +
          "ℹ️ Η παρουσία είχε ήδη καταγραφεί σήμερα." +
          "</div>";

      }


      let expiryText = "";

      if (data.expiry) {

        expiryText =
          "<div class='small'>" +
          "Λήξη συνδρομής: " +
          data.expiry +
          "</div>";

      }


      result.innerHTML =
        "✅ " + data.message +
        "<br><br>" +
        data.name +
        "<br><br>" +
        data.status +
        expiryText +
        duplicateText;

    }

  }

  catch (error) {

    console.error(error);

    result.className = "error";

    result.innerHTML =
      "❌ Σφάλμα σύνδεσης με το σύστημα";

  }


  // Επιστροφή σε READY
  setTimeout(function() {

    result.className = "ready";

    result.innerHTML =
      "Έτοιμο για σκανάρισμα";

    busy = false;

  }, 3000);

}



function onScanFailure(error) {

  // Δεν κάνουμε τίποτα.
  // Η κάμερα παραμένει ενεργή.

}



const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 180,
        height: 180
      },

      rememberLastUsedCamera: true,

      aspectRatio: 1
    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>


<script>

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("./sw.js")
      .then(function() {
        console.log("Service Worker registered");
      })
      .catch(function(error) {
        console.log("Service Worker registration failed:", error);
      });

  });

}

</script>

</body>

</html>
