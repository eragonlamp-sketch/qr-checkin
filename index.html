<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      margin-bottom: 25px;
      opacity: .8;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 18px;
      overflow: hidden;
    }

    #result {
      margin-top: 25px;
      min-height: 120px;
      padding: 20px;
      border-radius: 18px;
      font-size: 24px;
      font-weight: bold;
      background: #222;
    }

    .ready {
      color: white;
    }

    .active {
      background: #d9f2df !important;
      color: #137333;
    }

    .warning {
      background: #fff3cd !important;
      color: #8a6100;
    }

    .expired {
      background: #f8d7da !important;
      color: #b3261e;
    }

    .neutral {
      background: #e5e5e5 !important;
      color: #444;
    }

    .error {
      background: #f8d7da !important;
      color: #b3261e;
    }
  </style>
</head>


<body>

  <div class="container">

    <h1>📷 QR CHECK-IN</h1>

    <div class="subtitle">
      Δείξε το προσωπικό σου QR στην κάμερα
    </div>

    <div id="reader"></div>

    <div id="result" class="ready">
      Έτοιμο για σκανάρισμα
    </div>

  </div>


<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzYyKLJny_LTBuM6W048O1KdF064-XxBfKzsmgSj3akPj8exZIMWOMYs-rzk2_siq3t/exec";

let lastCode = "";
let lastScanTime = 0;
let busy = false;


async function onScanSuccess(decodedText) {

  const id = decodedText.trim();
  const now = Date.now();

  if (!id) return;

  // Αποφεύγουμε διπλό scan του ίδιου QR
  if (
    id === lastCode &&
    now - lastScanTime < 5000
  ) {
    return;
  }

  if (busy) return;

  busy = true;
  lastCode = id;
  lastScanTime = now;

  const result =
    document.getElementById("result");

  result.className = "ready";
  result.innerHTML = "⏳ Καταγραφή παρουσίας...";


  try {

    const response = await fetch(
      WEB_APP_URL + "?id=" + encodeURIComponent(id)
    );

    const html = await response.text();

    // Παίρνουμε μόνο το ορατό κείμενο από την HTML του Apps Script
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const pageText =
      doc.body.innerText || "";

    let name = "";
    let status = "";
    let message = "";

    // Προσπαθούμε να βρούμε το όνομα
    const nameEl =
      doc.querySelector(".name");

    if (nameEl) {
      name = nameEl.innerText.trim();
    }

    // Προσπαθούμε να βρούμε το status
    const statusEl =
      doc.querySelector(".status");

    if (statusEl) {
      status = statusEl.innerText.trim();
    }

    // Προσπαθούμε να βρούμε το μήνυμα
    const messageEl =
      doc.querySelector(".message");

    if (messageEl) {
      message = messageEl.innerText.trim();
    }


    if (!name && !status) {
      result.className = "error";
      result.innerHTML =
        "❌ Δεν μπόρεσα να διαβάσω τα στοιχεία του μαθητή.";
    } else {

      let cssClass = "neutral";

      const s =
        status.toUpperCase();

      if (s === "ΕΝΕΡΓΟΣ") {
        cssClass = "active";
      }
      else if (s === "ΛΗΓΕΙ ΣΥΝΤΟΜΑ") {
        cssClass = "warning";
      }
      else if (s === "ΕΛΗΞΕ") {
        cssClass = "expired";
      }

      result.className = cssClass;

      result.innerHTML =
        "✅ " + (message || "Παρουσία καταγράφηκε") +
        "<br><br>" +
        name +
        "<br><br>" +
        status;
    }

  }
  catch (err) {

    result.className = "error";

    result.innerHTML =
      "❌ Σφάλμα σύνδεσης με το σύστημα.";

  }


  // Μετά από 3 δευτερόλεπτα ξανά ready
  setTimeout(function() {

    result.className = "ready";

    result.innerHTML =
      "Έτοιμο για σκανάρισμα";

    busy = false;

  }, 3000);

}



function onScanFailure(error) {
  // Ο scanner συνεχίζει κανονικά.
}



const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      },

      rememberLastUsedCamera: true,

      aspectRatio: 1.333
    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
