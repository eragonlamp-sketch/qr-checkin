<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      margin-bottom: 25px;
      opacity: .8;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 18px;
      overflow: hidden;
    }

    #result {
      margin-top: 25px;
      min-height: 100px;
      padding: 20px;
      border-radius: 18px;
      font-size: 26px;
      font-weight: bold;
      background: #222;
    }

    .ready {
      color: white;
    }

    .success {
      background: #d9f2df !important;
      color: #137333;
    }
  </style>
</head>


<body>

  <div class="container">

    <h1>📷 QR CHECK-IN</h1>

    <div class="subtitle">
      Δείξε το προσωπικό σου QR στην κάμερα
    </div>


    <div id="reader"></div>


    <div id="result" class="ready">
      Έτοιμο για σκανάρισμα
    </div>

  </div>


<script>

let lastCode = "";
let lastScanTime = 0;


function onScanSuccess(decodedText) {

  const now = Date.now();


  // Αποφεύγουμε συνεχόμενα scans
  // του ίδιου QR σε πολύ μικρό χρονικό διάστημα.
  if (
    decodedText === lastCode &&
    now - lastScanTime < 5000
  ) {
    return;
  }


  lastCode = decodedText;
  lastScanTime = now;


  const result =
    document.getElementById("result");


  result.className = "success";

  result.innerHTML =
    "✅ QR ΔΙΑΒΑΣΤΗΚΕ<br><br>" +
    "ID: " +
    decodedText;


  // Μετά από 3 δευτερόλεπτα
  // η οθόνη ξαναδείχνει READY.
  setTimeout(function() {

    result.className = "ready";

    result.innerHTML =
      "Έτοιμο για σκανάρισμα";

  }, 3000);

}



function onScanFailure(error) {

  // Δεν κάνουμε τίποτα.
  // Ο scanner συνεχίζει να ψάχνει QR.

}



const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      },

      rememberLastUsedCamera: true,

      aspectRatio: 1.333
    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
